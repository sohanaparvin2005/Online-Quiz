
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>📝 Online Quiz App</h1>
            <p>Test Your Knowledge</p>
        </header>

        <!-- Start Screen -->
        <section id="start-screen" class="card">
            <h2>Welcome to Online Quiz!</h2>
            <p>Enter your name to start the quiz.</p>

            <input
                type="text"
                id="student-name"
                placeholder="Enter your name"
            >

            <button id="start-btn">Start Quiz</button>
            <p id="name-error" class="error"></p>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="card hidden">

            <div class="quiz-info">
                <span id="question-number">Question 1/10</span>
                <span id="timer">Time: 15s</span>
            </div>

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question">Question appears here</h2>

            <div id="options"></div>

            <p id="feedback"></p>

            <button id="next-btn" disabled>Next Question</button>

        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="card hidden">

            <h2>Quiz Completed! 🎉</h2>

            <h3 id="result-name"></h3>

            <div class="result-box">
                <p>Total Questions: <span id="total"></span></p>
                <p>Correct Answers: <span id="correct"></span></p>
                <p>Wrong Answers: <span id="wrong"></span></p>
                <h2 id="percentage"></h2>
                <h2 id="result-status"></h2>
            </div>

            <button id="restart-btn">Play Again</button>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
